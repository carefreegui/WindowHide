name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    # 只跑不需要"真实交互式桌面"的测试。
    # GUI 相关的测试(隐藏/恢复/静音/热键注入/全屏)必须在真实 Windows
    # 桌面会话里手动跑 —— 在 CI 的 headless runner 上必然 flaky,
    # 硬塞进去只会让 CI 变成常年红灯的摆设。
    name: logic (windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q windowhide tools tests

      - name: Pure-logic tests
        run: python tests/logic_test.py
